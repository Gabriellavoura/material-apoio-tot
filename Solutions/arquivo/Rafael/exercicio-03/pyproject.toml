[project]
name = "exercicio-03"
version = "0.1.0"
description = "Exercicio 03 - API FastAPI e SQS"
readme = "README.md"
authors = [
    { name = "rafaellavoura", email = "lavourarafael@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.118",
    "fastapi>=0.162.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "moto>=5.2.4",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false