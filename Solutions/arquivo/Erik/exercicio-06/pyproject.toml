[project]
name = "projeto-base"
version = "0.1.0"
description = "Ponto de partida para os exercícios do ToT"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "boto3",
    "sqlmodel",
    "psycopg[binary]",
    "opencv-python-headless>=5.0.0.93",
]

[dependency-groups]
dev = [
    "moto[s3,sqs]>=5.2.5",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
